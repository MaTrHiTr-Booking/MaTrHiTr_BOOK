<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .apple-gradient-start { stop-color: oklch(0.45 0.12 200); }
    .apple-gradient-end { stop-color: oklch(0.88 0.06 210); }
    
    @media (prefers-color-scheme: dark) {
      .apple-gradient-start { stop-color: oklch(0.65 0.1 200); }
      .apple-gradient-end { stop-color: oklch(0.88 0.06 210); }
    }
  </style>
  
  <defs>
    <linearGradient id="appleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" class="apple-gradient-start" stop-opacity="1" />
      <stop offset="100%" class="apple-gradient-end" stop-opacity="1" />
    </linearGradient>
  </defs>
  <rect width="180" height="180" rx="40" fill="url(#appleGradient)"/>
  <rect x="75" y="45" width="30" height="90" rx="5" fill="white"/>
  <rect x="45" y="75" width="90" height="30" rx="5" fill="white"/>
  <text x="90" y="110" font-family="Arial, sans-serif" font-size="50" font-weight="900" 
        fill="white" text-anchor="middle" opacity="0.8">M</text>
</svg>
