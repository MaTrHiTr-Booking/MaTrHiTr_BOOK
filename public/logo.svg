<svg width="200" height="50" viewBox="0 0 200 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#117A7A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3BA5A5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon: Medical Cross with Heart -->
  <g transform="translate(5, 10)">
    <circle cx="15" cy="15" r="15" fill="url(#gradient)" opacity="0.1"/>
    <path d="M15 5 L15 25 M5 15 L25 15" stroke="url(#gradient)" stroke-width="3" stroke-linecap="round"/>
    <path d="M15 8 Q20 10 20 15 Q20 18 15 22 Q10 18 10 15 Q10 10 15 8 Z" fill="url(#gradient)" opacity="0.8"/>
  </g>
  
  <!-- Text: MaTrHiTr -->
  <text x="45" y="33" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#117A7A">
    Ma<tspan fill="url(#gradient)">Tr</tspan>Hi<tspan fill="url(#gradient)">Tr</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="46" y="42" font-family="Arial, sans-serif" font-size="8" fill="#3BA5A5" letter-spacing="1">
    HEALTHCARE BOOKING
  </text>
</svg>
